name: bot-merge
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: startsWith(github.head_ref, 'bot-merge/')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "${{ github.event.pull_request.number }}" --merge --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
